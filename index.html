function updTxBadge(){const b=$('txbadge');if(b){b.style.display=TXPending>0?'inline':'none';b.title=t('translating')}}
function dv(s){
  if(LANG!=='en'||s==null)return s;
  const str=String(s);
  if(!hasArabic(str))return str;
  if(DTX[str]!=null)return DTX[str];
  if(!TXQ.has(str)){TXQ.add(str);TXPending++;updTxBadge()}
  if(!TXTimer)TXTimer=setTimeout(runTx,300);
  return str;
}
async function runTx(){
  TXTimer=null;
  if(TXBusy)return;
  TXBusy=true;
  const items=[...TXQ].filter(s=>DTX[s]==null);
  TXQ.clear();
  if(!items.length){TXBusy=false;TXPending=0;updTxBadge();return}
  const CONC=6;let idx=0;
  async function worker(){
    while(idx<items.length){
      const s=items[idx++];
      try{
        const url='https://api.mymemory.translated.net/get?q='+encodeURIComponent(s)+'&langpair=ar|en';
        const res=await fetch(url);
        const j=await res.json();
        const out=j&&j.responseData&&j.responseData.translatedText;
        DTX[s]=(out&&typeof out==='string'&&!/^[?؟]+$/.test(out))?out:s;
      }catch(e){DTX[s]=s}
    }
  }
  await Promise.all(Array.from({length:Math.min(CONC,items.length)},worker));
  svDTX();
  TXBusy=false;TXPending=Math.max(0,TXPending-items.length);updTxBadge();
  if(LANG==='en')renderAll(true);
  if(TXQ.size)TXTimer=setTimeout(runTx,300);
}

/* ---------- parsing ---------- */
function findHeaderRow(aoa){
  let best=0,bestScore=-1e9;
  for(let i=0;i<Math.min(15,aoa.length);i++){
    const row=aoa[i];if(!row||!row.length)continue;
    let str=0,num=0,ne=0;
    row.forEach(c=>{if(c===''||c==null)return;ne++;if(typeof c==='number'||c instanceof Date)num++;else str++});
    if(ne<2)continue;
    const score=str-num*2+ne*0.15;
    if(score>bestScore){bestScore=score;best=i}
  }
  return best;
}
function parseWorkbook(wb){
  const names=wb.SheetNames.filter(n=>{const s=wb.Sheets[n];return s&&s['!ref']});
  let bestSheet=names[0],bestCells=0;
  names.forEach(n=>{const s=wb.Sheets[n],aoa=XLSX.utils.sheet_to_json(s,{header:1,defval:'',raw:true});const cells=aoa.reduce((a,r)=>a+r.filter(c=>c!==''&&c!=null).length,0);if(cells>bestCells){bestCells=cells;bestSheet=n}});
  const aoa=XLSX.utils.sheet_to_json(wb.Sheets[bestSheet],{header:1,defval:'',raw:true});
  const hi=findHeaderRow(aoa);
  const headers=aoa[hi].map((c,i)=>{const s=(c==null?'':String(c).trim());return s||(t('auto_col')(i+1))});
  const seen={};
  const H=headers.map(h=>{if(seen[h]==null){seen[h]=0;return h}seen[h]++;return h+' ('+(seen[h]+1)+')'});
  const rows=aoa.slice(hi+1).filter(r=>r&&r.some(c=>c!==''&&c!=null)).map(r=>{const o=r.slice(0,H.length);while(o.length<H.length)o.push('');return o});
  return{headers:H,rows,sheet:bestSheet};
}
function parseNum(v){
  if(typeof v==='number')return v;
  if(v==null)return null;
  const s=String(v).trim();if(!s)return null;
  const pct=s.includes('%');
  const cleaned=s.replace(/[%\s,]/g,'');
  if(!/^-?\d+(\.\d+)?$/.test(cleaned))return null;
  const n=parseFloat(cleaned);
  return pct?n/100:n;
}
function classify(headers,rows){
  return headers.map((h,ci)=>{
    const raw=rows.map(r=>r[ci]).filter(v=>v!==undefined&&v!==null&&String(v).trim()!=='');
    const total=raw.length;
    if(!total)return{name:h,idx:ci,type:'empty'};
    let dateC=0,numC=0,fracC=0;const nums=[];
    raw.forEach(v=>{
      if(v instanceof Date){dateC++;return}
      if(typeof v==='number'){numC++;nums.push(v);if(v>=0&&v<=1)fracC++;return}
      const s=String(v).trim();
      if(/^\d{4}-\d{1,2}(-\d{1,2})?$/.test(s)||/^\d{1,2}\/\d{1,2}\/\d{2,4}$/.test(s)){dateC++;return}
      const n=parseNum(s);
      if(n!==null){numC++;nums.push(n);if(s.includes('%')||(n>=0&&n<=1))fracC++}
    });
    const distinctSet=new Set(raw.map(v=>v instanceof Date?v.getTime():String(v).trim()));
    const distinct=distinctSet.size;
    if(dateC/total>0.6)return{name:h,idx:ci,type:'date'};
    if(numC/total>0.6){
      const isPct=fracC/numC>0.5;
      return{name:h,idx:ci,type:isPct?'percent':'number',min:Math.min(...nums),max:Math.max(...nums)};
    }
    if(distinct<=30||distinct/total<0.5)return{name:h,idx:ci,type:'category',distinct};
    return{name:h,idx:ci,type:'text',distinct};
  });
}
function getDate(v){if(v instanceof Date&&!isNaN(v))return v;if(typeof v==='string'){const m=v.match(/(\d{4})-(\d{1,2})(?:-(\d{1,2}))?/);if(m)return new Date(+m[1],+m[2]-1,+(m[3]||1));const m2=v.match(/(\d{1,2})\/(\d{1,2})\/(\d{2,4})/);if(m2)return new Date(+m2[3],+m2[2]-1,+m2[1])}return null}
function getNum(v){return typeof v==='number'?v:parseNum(v)}
function getCat(v){return v==null?'':String(v).trim()}

/* ---------- natural-language Q&A ---------- */
function normAr(s){
  return String(s==null?'':s).toLowerCase()
    .replace(/[ً-ْٰـ]/g,'')
    .replace(/[إأآا]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه').replace(/ؤ/g,'و').replace(/ئ/g,'ي')
    .replace(/[؟?!.,،؛;:"'()]/g,' ')
    .replace(/\s+/g,' ').trim();
}
function isArabicText(s){return /[؀-ۿ]/.test(s)}
const QA_INTENTS=[
  ['sum',['مجموع','اجمالي','إجمالي','sum','total']],
  ['avg',['متوسط','معدل','average','avg','mean']],
  ['max',['اعلى','أعلى','اكبر','أكبر','اكثر','أكثر','max','maximum','highest','most','top']],
  ['min',['اقل','أقل','ادنى','أدنى','min','minimum','lowest','least']],
  ['list',['اعرض','وريني','ورني','اظهر','أظهر','عرض','list','show','display']],
  ['count',['كم عدد','كم','عدد','count','how many','number of']]
];
function qaDetectIntent(qn){
  const qWords=tokenizeAr(qn);
  for(const[intent,words]of QA_INTENTS){
    for(const w of words){
      const wn=normAr(w);
      if(wn.includes(' ')){if(qn.includes(wn))return intent}
      else if(qWords.some(qw=>wordsMatch(qw,wn)))return intent;
    }
  }
  return'count';
}
/* fuzzy Arabic word matching: handles plurals (broken plurals too), definite article,
   and common suffixes, so "حدائق" matches "حديقة", "التدخلات الحضرية" matches "تدخل حضري", etc. */
function tokenizeAr(s){return normAr(s).split(' ').filter(w=>w.length>=2)}
function arStem(w){
  let s=w;
  s=s.replace(/^لل/,'');
  s=s.replace(/^(و|ف)?ال/,'');
  s=s.replace(/(يه|ات|ين|ون|ها|ه)$/,'');
  return s;
}
function arRoot(w){return w.replace(/[اويهئءؤ]/g,'')}
function wordsMatch(a,b){
  if(!a||!b)return false;
  if(a===b)return true;
  if(a.length<2||b.length<2)return false;
  const sa=arStem(a),sb=arStem(b);
  if(sa.length>=2&&sa===sb)return true;
  const ra=arRoot(sa),rb=arRoot(sb);
  if(ra.length>=2&&ra===rb)return true;
  if(a.length>=4&&b.length>=4&&(a.includes(b)||b.includes(a)))return true;
  return false;
}
function phraseHits(valueWords,qWords){
  let hits=0;
  valueWords.forEach(vw=>{if(qWords.some(qw=>wordsMatch(vw,qw)))hits++});
  return hits;
}
function qaDetectColumn(qn,cols){
  const qWords=tokenizeAr(qn);
  let best=null,bestScore=0;
  cols.forEach(c=>{
    const cWords=tokenizeAr(c.name);if(!cWords.length)return;
    const hits=phraseHits(cWords,qWords);
    const ratio=hits/cWords.length;
    if(ratio>=0.6&&hits>0){
      const score=hits*10+cWords.join('').length;
      if(score>bestScore){bestScore=score;best=c}
    }
  });
  return best;
}
function qaDetectCatFilters(qn){
  const qWords=tokenizeAr(qn);
  const filters={},bestScore={};
  catCols().forEach(c=>{
    const vals=[...new Set(DS.rows.map(r=>getCat(r[c.idx])).filter(Boolean))];
    vals.forEach(v=>{
      const vWords=tokenizeAr(v).filter(w=>!['بلديه','امانه','محافظه','منطقه','قسم','فرع'].includes(arStem(w))&&arStem(w)!=='بلد');
      const words=vWords.length?vWords:tokenizeAr(v);
      if(!words.length)return;
      const hits=phraseHits(words,qWords);
      const ratio=hits/words.length;
      if(ratio>=0.75&&hits>0){
        const score=hits*10+words.join('').length;
        if(score>(bestScore[c.idx]||0)){bestScore[c.idx]=score;filters[c.idx]=v}
      }
    });
  });
  return filters;
}
function qaDetectComparison(qn){
  const gt='اكبر|أكبر|اكثر|أكثر|greater|more|over|above';
  const lt='اقل|أقل|اصغر|أصغر|less|under|below';
  let m=qn.match(new RegExp('(?:'+gt+')[^\\d]{0,6}(\\d+(?:\\.\\d+)?)'));
  if(m)return{op:'>',val:parseFloat(m[1])};
  m=qn.match(new RegExp('(?:'+lt+')[^\\d]{0,6}(\\d+(?:\\.\\d+)?)'));
  if(m)return{op:'<',val:parseFloat(m[1])};
  return null;
}
function answerQuestion(q){
  if(!DS)return isArabicText(q)?'ارفع ملف أولاً.':'Upload a file first.';
  const ar=isArabicText(q),qn=normAr(q);
  const intent=qaDetectIntent(qn);
  const catFilters=qaDetectCatFilters(qn);
  const metricCol=qaDetectColumn(qn,numCols());
  const cmp=qaDetectComparison(qn);
  let rows=DS.rows.filter(r=>{for(const idx in catFilters){if(getCat(r[idx])!==catFilters[idx])return false}return true});
  const cmpCol=metricCol||pickForecastCol();
  if(cmp&&cmpCol){
    rows=rows.filter(r=>{
      const n=getNum(r[cmpCol.idx]);if(n==null)return false;
      const v=(cmpCol.type==='percent'&&cmp.val>1)?cmp.val/100:cmp.val;
      return cmp.op==='>'?n>v:n<v;
    });
  }
  f={};Object.keys(catFilters).forEach(idx=>{f[idx]=catFilters[idx]});
  renderAll(true);
  let answer;
  if(intent==='sum'||intent==='avg'){
    const col=metricCol||pickForecastCol();
    if(!col)answer=ar?'لم أجد عموداً رقمياً مناسباً للسؤال.':'No matching numeric column found.';
    else{
      const nums=rows.map(r=>getNum(r[col.idx])).filter(x=>x!=null);
      if(!nums.length)answer=ar?'لا توجد بيانات رقمية مطابقة.':'No numeric data matched.';
      else{
        const s=nums.reduce((a,b)=>a+b,0),val=intent==='sum'?s:s/nums.length;
        const fmt=col.type==='percent'?(Math.round(val*1000)/10+'%'):(Math.round(val*100)/100);
        answer=ar?((intent==='sum'?'المجموع':'المتوسط')+' لعمود «'+col.name+'»: '+fmt+' (من '+nums.length+' صف)'):((intent==='sum'?'Sum':'Average')+' of "'+dv(col.name)+'": '+fmt+' (over '+nums.length+' rows)');
      }
    }
  }else if(intent==='max'||intent==='min'){
    const col=metricCol||pickForecastCol();
    if(!col)answer=ar?'لم أجد عموداً رقمياً مناسباً.':'No matching numeric column.';
    else{
      const idCol=DS.cols.find(c=>c.type==='text')||DS.cols.find(c=>c.type==='category');
      let best=null;
      rows.forEach(r=>{const n=getNum(r[col.idx]);if(n==null)return;if(!best||(intent==='max'?n>best.n:n<best.n))best={n,r}});
      if(!best)answer=ar?'لا توجد بيانات كافية.':'Not enough data.';
      else{
        const label=idCol?getCat(best.r[idCol.idx]):'';
        const fmt=col.type==='percent'?(Math.round(best.n*1000)/10+'%'):(Math.round(best.n*100)/100);
        answer=ar?((intent==='max'?'الأعلى':'الأدنى')+' في «'+col.name+'»'+(label?': '+label:'')+' — '+fmt):((intent==='max'?'Highest':'Lowest')+' in "'+dv(col.name)+'"'+(label?': '+dv(label):'')+' — '+fmt);
      }
    }
  }else if(intent==='list'){
    answer=ar?('تم العثور على '+rows.length+' صف مطابق — شاهد جدول النتائج وباقي الشارتات بالأسفل (تم تحديثها تلقائياً).'):('Found '+rows.length+' matching rows — see the results table and charts below (auto-updated).');
  }else{
    answer=ar?('العدد: '+rows.length+' صف يطابق الشرط.'):('Count: '+rows.length+' matching rows.');
  }
  return answer;
}

/* ---------- forecast ---------- */
function pickForecastCol(){
  const kw=['نسبة','تقدم','انجاز','إنجاز','progress','percent','completion'];
  let p=DS.cols.find(c=>c.type==='percent'&&kw.some(k=>c.name.toLowerCase().includes(k)));
  if(!p)p=DS.cols.find(c=>c.type==='percent');
  if(!p)p=DS.cols.find(c=>c.type==='number');
  return p;
}
function pickDateCol(){
  const kw=['تاريخ','date','start','due','target','deadline','موعد'];
  let d=DS.cols.find(c=>c.type==='date'&&kw.some(k=>c.name.toLowerCase().includes(k)));
  if(!d)d=DS.cols.find(c=>c.type==='date');
  return d;
}
function fcValue(col,v){
  if(col.type==='percent')return Math.max(0,Math.min(1,getNum(v)||0));
  const n=getNum(v);if(n==null)return 0;
  const span=(col.max-col.min)||1;
  return Math.max(0,Math.min(1,(n-col.min)/span));
}
function renderForecast(rs){
  const pc=pickForecastCol();
  const box=$('fcbox');
  if(!pc){box.innerHTML='<div class="n">'+t('forecast_none')+'</div>';delete EX.fc;return}
  const dc=pickDateCol();
  const vals=rs.map(r=>fcValue(pc,r[pc.idx]));
  const n=rs.length||1;
  const r=FC.rate/100,L=FC.lag,H=12;
  let baseDates=null;
  if(dc){
    baseDates=rs.map(r2=>getDate(r2[dc.idx]));
  }
  const now=new Date();
  const lb=[t('now')];
  let ly=now.getFullYear(),lm=now.getMonth();
  for(let k=1;k<=H;k++){lm++;if(lm>11){lm=0;ly++}lb.push(ly+'-'+String(lm+1).padStart(2,'0'))}
  const pr=(p0,k,d)=>{
    if(p0>=1)return 1;
    if(p0>0)return Math.min(1,p0+r*k);
    let delay=L;
    if(d){const months=(now.getFullYear()-d.getFullYear())*12+(now.getMonth()-d.getMonth());delay=Math.max(0,L-months)}
    return k>delay?Math.min(1,r*(k-delay)):0;
  };
  const st=k=>{let s=0,c=0;vals.forEach((p0,i)=>{const d=baseDates?baseDates[i]:null;const p=pr(p0,k,d);s+=p;if(p>=1)c++});return[s/n*100,c]};
  const av=[],dn=[];for(let k=0;k<=H;k++){const z=st(k);av.push(z[0]);dn.push(z[1])}
  let kA=-1;for(let k=0;k<=240;k++)if(st(k)[1]==n){kA=k;break}
  const dp=dn.map(c=>c/n*100);
  const X0=k=>35+k*(550/H),Y=v=>165-v*1.45,P=a=>a.map((v,k)=>X0(k).toFixed(1)+','+Y(v).toFixed(1)).join(' ');
  EX.fc={n:'Forecast',rows:[['Month','Avg %','Complete %','Complete count']].concat(lb.map((l,k)=>[l,Math.round(av[k]*10)/10,Math.round(dp[k]*10)/10,dn[k]]))};
  const svg='<svg viewBox="0 0 600 190" style="width:100%">'+[0,50,100].map(v=>'<line x1="35" x2="585" y1="'+Y(v)+'" y2="'+Y(v)+'" stroke="var(--bd)"/><text x="30" y="'+(Y(v)+3)+'" text-anchor="end">'+v+'%</text>').join('')+'<polyline fill="none" stroke="var(--ac)" stroke-width="2.5" points="'+P(av)+'"/><polyline fill="none" stroke="var(--ac2)" stroke-width="2.5" stroke-dasharray="5 4" points="'+P(dp)+'"/>'+[0,6,12].map(k=>'<text x="'+X0(k)+'" y="182" text-anchor="'+(k==0?'start':k==12?'end':'middle')+'">'+lb[k]+'</text>').join('')+'<text x="'+(X0(0)+4)+'" y="'+(Y(av[0])-6)+'">'+Math.round(av[0])+'%</text><text x="'+X0(H)+'" y="'+(Y(av[H])-6)+'" text-anchor="end">'+Math.round(av[H])+'%</text></svg>';
  const note='<span style="color:var(--ac)">'+t('forecast_legend_avg')(dv(pc.name))+'</span> · <span style="color:var(--ac2)">'+t('forecast_legend_100')+'</span><br>'+t('forecast_summary')(Math.round(av[H]),dn[H],n,kA)+(dc?t('forecast_date_based')(dv(dc.name)):t('forecast_no_date'))+(pc.type!=='percent'?t('forecast_normalized')(dv(pc.name)):'');
  box.innerHTML='<div class="n" style="margin:0 0 4px;display:flex;flex-wrap:wrap;gap:4px 14px;align-items:center"><label>'+t('monthly_rate')+' <input type="range" id="rt" min="1" max="25" step="0.5" value="'+FC.rate+'"> <b>'+FC.rate+'%</b></label>'+(dc?'':'<label>'+t('lag_label')+' <input type="range" id="lg" min="0" max="18" step="1" value="'+FC.lag+'"> <b>'+FC.lag+'</b> '+t('months')+'</label>')+'</div>'+svg+'<div class="n">'+note+'</div>';
  const rtEl=$('rt');if(rtEl)rtEl.oninput=e=>{FC.rate=+e.target.value;renderAll(true)};
  const lgEl=$('lg');if(lgEl)lgEl.oninput=e=>{FC.lag=+e.target.value;renderAll(true)};
}

/* ---------- drag & drop reordering ---------- */
(function initDragReorder(){
  let dragKey=null;
  document.addEventListener('dragstart',e=>{
    const el=e.target.closest&&e.target.closest('.grid>[data-key]');
    if(!el){return}
    dragKey=el.dataset.key;
    if(e.dataTransfer){e.dataTransfer.effectAllowed='move';try{e.dataTransfer.setData('text/plain',dragKey)}catch(_){}}
    el.classList.add('dragging');
  });
  document.addEventListener('dragend',e=>{
    const el=e.target.closest&&e.target.closest('.grid>[data-key]');
    if(el)el.classList.remove('dragging');
    document.querySelectorAll('.drag-over').forEach(x=>x.classList.remove('drag-over'));
    dragKey=null;
  });
  document.addEventListener('dragover',e=>{
    const el=e.target.closest&&e.target.closest('.grid>[data-key]');
    if(!el||!dragKey)return;
    e.preventDefault();
    if(e.dataTransfer)e.dataTransfer.dropEffect='move';
    document.querySelectorAll('.drag-over').forEach(x=>{if(x!==el)x.classList.remove('drag-over')});
    el.classList.add('drag-over');
  });
  document.addEventListener('drop',e=>{
    const el=e.target.closest&&e.target.closest('.grid>[data-key]');
    if(!el||!dragKey)return;
    e.preventDefault();
    el.classList.remove('drag-over');
    const targetKey=el.dataset.key;
    if(targetKey!==dragKey){
      const r=el.getBoundingClientRect();
      const before=(e.clientX-r.left)<r.width/2;
      reorderKeys(dragKey,targetKey,before);
      renderAll(true);
    }
    dragKey=null;
  });
})();

/* ---------- generic charts ---------- */
function barCard(id,title,label,vals,total){
  const mx=Math.max(...vals.map(v=>v[1]),1);
  EX[id]={n:title,rows:[[label,'#','%']].concat(vals.map(([l,v])=>[l,v,Math.round(v/total*100)]))};
  const shown=vals.slice(0,15);
  const extra=vals.length>15?'<div class="n">'+t('other_cat')(vals.length-15)+'</div>':'';
  return'<div class="c" data-key="'+id+'" draggable="true"><h2><span class="dh">⠿</span> '+dv(title)+'<button class="e" data-k="'+id+'">'+t('export_one')+'</button></h2><div class="bd">'+shown.map(([l,v])=>'<div class="r"><span>'+dv(l)+'</span><i><u style="width:'+(v/mx*100)+'%"></u></i><em>'+v+' ('+Math.round(v/total*100)+'%)</em></div>').join('')+extra+'</div></div>';
}
function categoryCard(col,rs){
  const counts={};
  rs.forEach(r=>{const v=getCat(r[col.idx])||t('empty_value');counts[v]=(counts[v]||0)+1});
  const vals=Object.entries(counts).sort((a,b)=>b[1]-a[1]);
  return barCard('cat'+col.idx,col.name,col.name,vals,rs.length||1);
}
function numDistCard(col,rs){
  const nums=rs.map(r=>getNum(r[col.idx])).filter(n=>n!=null);
  if(!nums.length)return'';
  let min=Math.min(...nums),max=Math.max(...nums);if(min===max)max=min+1;
  const bins=6,w=(max-min)/bins;
  const counts=Array(bins).fill(0);
  nums.forEach(n=>{let b=Math.floor((n-min)/w);if(b>=bins)b=bins-1;if(b<0)b=0;counts[b]++});
  const fmt=v=>col.type==='percent'?Math.round(v*100)+'%':(Math.round(v*100)/100);
  const vals=counts.map((c,i)=>[fmt(min+i*w)+' – '+fmt(min+(i+1)*w),c]);
  return barCard('num'+col.idx,col.name+t('dist_suffix'),col.name,vals,nums.length);
}

/* ---------- custom charts ---------- */
function mv(rs,col,agg){
  if(agg==='cnt')return rs.length;
  if(!col)return rs.length;
  const nums=rs.map(r=>getNum(r[col.idx])).filter(n=>n!=null);
  if(agg==='avg')return nums.length?Math.round(nums.reduce((a,b)=>a+b,0)/nums.length*(col.type==='percent'?100:1)*100)/100:0;
  if(agg==='sum')return Math.round(nums.reduce((a,b)=>a+b,0)*100)/100;
  return rs.length;
}

  const withIdx=cards.map((c,i)=>({c,i,o:oi.hasOwnProperty(c.key)?oi[c.key]:(1e9+i)}));
  withIdx.sort((a,b)=>a.o-b.o||a.i-b.i);
  return withIdx.map(x=>x.c.html).join('');

function reorderKeys(dragKey,targetKey,before){
  const grid=document.querySelector('.grid');
  let list=grid?[...grid.querySelectorAll(':scope > [data-key]')].map(e=>e.dataset.key):ORDER.slice();
